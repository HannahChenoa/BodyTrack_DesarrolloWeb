<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BodyTrack - Iniciar sesión</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
      min-height: 100vh;
    }
  </style>

  <script>
    function toggleForms() {
      let formLogin = document.getElementById('formLogin');
      let formRegister = document.getElementById('formRegister');

      if (formRegister.style.display === 'none') {
        formLogin.style.display = 'none';
        formRegister.style.display = 'block';
      } else {
        formLogin.style.display = 'block';
        formRegister.style.display = 'none';
      }
    }
  </script>
</head>

<body class="d-flex justify-content-center align-items-center">

  <div class="card shadow p-4" style="width: 24rem;">
    <h2 class="text-center mb-4">BodyTrack</h2>

    <!-- Formulario de Login -->
    <form id="formLogin">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="loginEmail" required>
      </div>

      <div class="mb-3">
        <label for="loginPassword" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="loginPassword" minlength="8" required>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-primary">Iniciar sesión</button>
      </div>

      <div class="text-center mt-3">
        <a href="#" onclick="toggleForms()">¿No tienes cuenta? Regístrate aquí</a>
      </div>
    </form>

    <!-- Formulario de Registro -->
    <form id="formRegister" style="display: none;">
      <div class="mb-3">
        <label for="registerName" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="registerName" required>
      </div>

      <div class="mb-3">
        <label for="registerEmail" class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" id="registerEmail" required>
      </div>

      <div class="mb-3">
        <label for="registerPassword" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="registerPassword" minlength="8" required>
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-success">Crear cuenta</button>
      </div>

      <div class="text-center mt-3">
        <a href="#" onclick="toggleForms()">¿Ya tienes cuenta? Iniciar sesión</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script para redirigir después de login -->
  <script>
    const formLogin = document.getElementById('formLogin');

    formLogin.addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const response = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          // Reusar datos del registro
          const login = await fetch('http://localhost:3000/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });

          const loginData = await login.json();

          if (login.ok) {
            localStorage.setItem('user', JSON.stringify(loginData.user));
            window.location.href = 'home.html';
          } else {
            alert('Error iniciando sesión automática');
          }
        }
      } catch (error) {
        console.error('Error al iniciar sesión:', error);
        alert('Error al conectar con el servidor');
      }
    });
  </script>
  <script>
    const formRegister = document.getElementById('formRegister');

    formRegister.addEventListener('submit', async function (e) {
      e.preventDefault();

      const name = document.getElementById('registerName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      try {
        const response = await fetch('http://localhost:3000/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Registro exitoso');

          // Guarda el usuario en localStorage
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirige directamente al home
         
          try {
            const response = await fetch('http://localhost:3000/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
              // Reusar datos del registro
              const login = await fetch('http://localhost:3000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
              });

              const loginData = await login.json();

              if (login.ok) {
                localStorage.setItem('user', JSON.stringify(loginData.user));
                window.location.href = 'home.html';
              } else {
                alert('Error iniciando sesión automática');
              }
            }
          } catch (error) {
            console.error('Error al iniciar sesión:', error);
            alert('Error al conectar con el servidor');
          }



          //window.location.href = './home.html';
        }
      } catch (error) {
        console.error('Error en registro:', error);
        alert('Error al conectar con el servidor');
      }
    });
  </script>

</body>

</html>
